<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice"><rect width="1200" height="900" fill="#0b0b0b"/><rect x="12" y="12" width="1176" height="876" fill="none" stroke="#ff3b5c" stroke-opacity=".35" stroke-width="3" stroke-dasharray="18 14"/><text x="600.0" y="360" fill="#ff3b5c" fill-opacity=".85" font-family="sans-serif" font-weight="700" font-size="35" text-anchor="middle">Illustrazione di Hazard</text><text x="600.0" y="422" fill="#fff" fill-opacity=".6" font-family="sans-serif" font-size="28" text-anchor="middle">Non un mostro. Una presenza rossa che resta nell&#x27;ombra, fatta di rischi di</text><text x="600.0" y="463" fill="#fff" fill-opacity=".6" font-family="sans-serif" font-size="28" text-anchor="middle">tutti i giorni (nastro di pericolo, un cavo scoperto, una scadenza</text><text x="600.0" y="503" fill="#fff" fill-opacity=".6" font-family="sans-serif" font-size="28" text-anchor="middle">dimenticata, un orologio che corre).</text><text x="600.0" y="558" fill="#fff" fill-opacity=".6" font-family="sans-serif" font-size="28" text-anchor="middle">Rosso #ff3b5c su fondo nero, stesso stile 3D di Ingenio.</text><text x="600.0" y="612" fill="#fff" fill-opacity=".6" font-family="sans-serif" font-size="28" text-anchor="middle">1200 × 900, .webp, nome file hazard.webp</text></svg>