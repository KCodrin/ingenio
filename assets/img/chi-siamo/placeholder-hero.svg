<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice"><rect width="1920" height="1080" fill="#0b0b0b"/><rect x="12" y="12" width="1896" height="1056" fill="none" stroke="#00e676" stroke-opacity=".35" stroke-width="3" stroke-dasharray="18 14"/><text x="960.0" y="396" fill="#00e676" fill-opacity=".85" font-family="sans-serif" font-weight="700" font-size="56" text-anchor="middle">Immagine hero · Chi siamo</text><text x="960.0" y="495" fill="#fff" fill-opacity=".6" font-family="sans-serif" font-size="45" text-anchor="middle">Ingenio in primo piano con, alle spalle, la squadra di Tutor Consulting (un</text><text x="960.0" y="560" fill="#fff" fill-opacity=".6" font-family="sans-serif" font-size="45" text-anchor="middle">operaio con il casco, uno chef, una consulente con il tablet).</text><text x="960.0" y="648" fill="#fff" fill-opacity=".6" font-family="sans-serif" font-size="45" text-anchor="middle">Sfondo scuro con luce verde che arriva da destra. Lasciare libera e scura la</text><text x="960.0" y="713" fill="#fff" fill-opacity=".6" font-family="sans-serif" font-size="45" text-anchor="middle">metà sinistra, dove va il titolo.</text><text x="960.0" y="801" fill="#fff" fill-opacity=".6" font-family="sans-serif" font-size="45" text-anchor="middle">1920 × 1080, formato .webp, nome file hero-chi-siamo.webp</text></svg>